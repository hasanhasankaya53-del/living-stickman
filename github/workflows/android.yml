name: Android CI

on:
  push:
    branches: [main, 'stage-*/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: API anahtarı sızıntı kontrolü
        run: |
          if grep -rIE --exclude-dir=.git 'AIza[0-9A-Za-z_-]{35}' .; then
            echo "HATA: Depoda API anahtarı benzeri bir değer bulundu."
            exit 1
          fi

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur (lisanslar dahil)
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Birim testleri ve debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Debug APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: living-stickman-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
