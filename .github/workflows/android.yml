name: Android CI

on:
  push:
    branches: [main, 'stage-*/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: API anahtarı sızıntı kontrolü
        run: |
          # app/google-services.json Firebase istemci yapılandırmasıdır ve kendi Firebase
          # anahtarını içerir (Gemini anahtarı değildir). Bu dosya dışında hiçbir yerde
          # "AIza..." biçiminde anahtar olmamalıdır. Gemini anahtarı depoya girmez.
          matches="$(find . -path ./.git -prune -o -type f ! -path './app/google-services.json' -print0 \
            | xargs -0 grep -IlE 'AIza[0-9A-Za-z_-]{35}' || true)"
          if [ -n "$matches" ]; then
            echo "HATA: Aşağıdaki dosyalarda API anahtarı benzeri bir değer bulundu:"
            echo "$matches"
            exit 1
          fi
          echo "Sızıntı kontrolü temiz."

      - name: google-services.json doğrulaması
        run: |
          f=app/google-services.json
          if [ ! -f "$f" ]; then
            echo "HATA: $f bulunamadı. Firebase eklentisi bu dosya olmadan derleyemez."
            exit 1
          fi
          jq -e '.project_info.project_id and (.client | length > 0)' "$f" > /dev/null \
            || { echo "HATA: $f geçerli bir Firebase istemci yapılandırması gibi görünmüyor."; exit 1; }
          jq -e --arg p com.hasankaya.livingstickman \
            '[.client[].client_info.android_client_info.package_name] | index($p) != null' "$f" > /dev/null \
            || { echo "HATA: $f içinde com.hasankaya.livingstickman paket adı yok."; exit 1; }
          if grep -qiE 'private_key|client_secret|service_account|BEGIN [A-Z ]*PRIVATE KEY' "$f"; then
            echo "HATA: $f içinde gizli bilgi alanı var. Bu dosya yalnızca istemci yapılandırması olmalı."
            exit 1
          fi
          echo "$f geçerli."

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Önceden kurulu Android SDK'yı hazırla
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -path '*/bin/*' 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "HATA: '$SDK_ROOT/cmdline-tools' altında çalıştırılabilir bir sdkmanager bulunamadı."
            echo "Android SDK klasörü: $SDK_ROOT"
            echo "--- $SDK_ROOT ---"
            ls -la "$SDK_ROOT" 2>&1 || true
            echo "--- $SDK_ROOT/cmdline-tools ---"
            ls -la "$SDK_ROOT/cmdline-tools" 2>&1 || true
            exit 1
          fi

          echo "sdkmanager yolu: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Birim testleri, debug APK ve release derleme kontrolü
        run: gradle testDebugUnitTest assembleDebug compileReleaseKotlin --stacktrace

      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Debug APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: living-stickman-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
