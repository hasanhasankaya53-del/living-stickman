name: Android CI

on:
  push:
    branches: [main, 'stage-*/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: API anahtarı sızıntı kontrolü
        run: |
          if grep -rIE --exclude-dir=.git 'AIza[0-9A-Za-z_-]{35}' .; then
            echo "HATA: Depoda API anahtarı benzeri bir değer bulundu."
            exit 1
          fi

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Önceden kurulu Android SDK'yı hazırla
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -path '*/bin/*' 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "HATA: '$SDK_ROOT/cmdline-tools' altında çalıştırılabilir bir sdkmanager bulunamadı."
            echo "Android SDK klasörü: $SDK_ROOT"
            echo "--- $SDK_ROOT ---"
            ls -la "$SDK_ROOT" 2>&1 || true
            echo "--- $SDK_ROOT/cmdline-tools ---"
            ls -la "$SDK_ROOT/cmdline-tools" 2>&1 || true
            exit 1
          fi

          echo "sdkmanager yolu: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Birim testleri ve debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Debug APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: living-stickman-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
